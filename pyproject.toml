[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-vs-plan"
version = "0.1.0"
description = "Compare what a Claude subscription costs against the API-equivalent price of the same usage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
avp = "avp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
